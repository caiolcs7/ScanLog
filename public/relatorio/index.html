<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <title>Relatório dos Containers</title>
    <style>
      :root { color-scheme: light dark; --bg: #eff0ed; --ink: #14181b; --muted: #5a6267; --accent: #e0560f; }
      @media (prefers-color-scheme: dark) { :root { --bg: #101315; --ink: #eceff1; --muted: #98a1a7; --accent: #ff7a33; } }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
        background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; }
      p { margin: 0; max-width: 360px; }
      .bar { width: 160px; height: 4px; margin: 14px auto 0; border-radius: 2px; background: color-mix(in srgb, var(--muted) 25%, transparent); overflow: hidden; }
      .bar i { display: block; width: 40%; height: 100%; background: var(--accent); animation: go 1.1s ease-in-out infinite alternate; }
      @keyframes go { from { transform: translateX(-10%); } to { transform: translateX(160%); } }
      button { margin-top: 14px; font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 10px; border: 0; background: var(--ink); color: var(--bg); }
    </style>
  </head>
  <body>
    <div id="m"><p>Carregando o relatório… · 正在加载…</p><div class="bar"><i></i></div></div>
    <script>
      /* Cópia só de leitura do Relatório dos Containers. O original é um Artifact do Claude, que não abre
         em alguns países (ex.: China). Quando o dono abre ou salva o Relatório, ele manda o código e os
         dados ao Supabase; aqui montamos a mesma página com eles e avisamos quando chega coisa nova. */
      (function () {
        var U = 'https://pygedyytlcplfweibenv.supabase.co/rest/v1/relatorio_espelho';
        var K = 'sb_publishable_Wo0BJpc1B3O8Feog9to3yQ_PcBZfNcQ';
        var S = '<script type="application/json" id="state">';
        function get(q) {
          return fetch(U + q, { headers: { apikey: K, Authorization: 'Bearer ' + K }, cache: 'no-store' }).then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
          });
        }
        function fail() {
          document.getElementById('m').innerHTML =
            '<p>Não foi possível carregar o relatório agora. · 暂时无法加载报告。</p><button type="button" onclick="location.reload()">Tentar de novo · 重试</button>';
        }
        /* Vigia: a cada 30 s (com a aba visível) olha se o relatório mudou e oferece atualizar */
        function watcher(last) {
          return '<script>(function(){var U=' + JSON.stringify(U) + ',K=' + JSON.stringify(K) + ',L=' + JSON.stringify(last) + ',shown=false;' +
            'function tick(){if(document.hidden||shown)return;fetch(U+"?select=atualizado&order=atualizado.desc&limit=1",{headers:{apikey:K,Authorization:"Bearer "+K},cache:"no-store"})' +
            '.then(function(r){return r.ok?r.json():[]}).then(function(r){if(r[0]&&r[0].atualizado>L){shown=true;var b=document.createElement("button");b.type="button";' +
            'b.textContent="Relatório atualizado, toque para ver · 报告已更新";b.style.cssText="position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;' +
            'max-width:calc(100% - 32px);padding:12px 18px;border:0;border-radius:12px;background:#e0560f;color:#fff;font:600 15px system-ui,sans-serif;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)";' +
            'b.onclick=function(){location.reload()};document.body.appendChild(b)}}).catch(function(){})}' +
            'setInterval(tick,30000);document.addEventListener("visibilitychange",tick)})();<\/script>';
        }
        get('?select=chave,valor,atualizado')
          .then(function (rows) {
            var st = { ru: {} }, html = null, last = '';
            rows.forEach(function (r) {
              if (r.atualizado > last) last = r.atualizado;
              if (r.chave === 'html') html = r.valor;
              else if (r.chave.indexOf('ru:') === 0) st.ru[r.chave.slice(3)] = JSON.parse(r.valor);
              else if (r.chave.indexOf('s:') === 0) st[r.chave.slice(2)] = JSON.parse(r.valor);
            });
            var i = html ? html.indexOf(S) : -1;
            if (i < 0) throw new Error('vazio');
            var j = html.indexOf('<\/script>', i);
            var json = JSON.stringify(st).replace(/</g, '\\u003c');
            html = html.slice(0, i + S.length) + json + html.slice(j);
            var e = html.lastIndexOf('</body>');
            html = e < 0 ? html + watcher(last) : html.slice(0, e) + watcher(last) + html.slice(e);
            document.open();
            document.write(html);
            document.close();
          })
          .catch(fail);
      })();
    </script>
  </body>
</html>
